<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Wolfy | Anchor OS</title><style>body{margin:0;background:#101418;color:#f5f7fa;font:16px system-ui;display:grid;place-items:center;height:100vh}.app{width:min(720px,90vw);height:min(80vh,680px);display:flex;flex-direction:column;padding:24px;background:#182027;border:1px solid #34434d;border-radius:24px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:20px;letter-spacing:2px}.chat{flex:1;overflow:auto;padding:18px 0}.msg{padding:13px 16px;border-radius:16px;margin:10px 0;max-width:80%;white-space:pre-wrap}.assistant{background:#26343d}.user{background:#c5e86c;color:#101418;margin-left:auto}.form{display:flex;gap:10px}.form input{flex:1;padding:14px;border-radius:14px;border:1px solid #40505c;background:#0b0f12;color:#fff}.form button{border:0;border-radius:14px;padding:0 20px;background:#c5e86c;font-weight:700}</style></head><body><main class="app"><header class="head"><h1>ASK WOLFY</h1><span>Anchor OS AI</span></header><section class="chat" id="chat"><div class="msg assistant">Hi, I am Ask Wolfy. What are you learning today?</div></section><form class="form" id="form"><input id="input" placeholder="Ask a question" autocomplete="off"><button>Send</button></form></main><script>const form=document.querySelector('#form'),input=document.querySelector('#input'),chat=document.querySelector('#chat'),messages=[];function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';messages.push({role:'user',content:text});add(text,'user');try{const r=await fetch('/api/ask-wolfy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const d=await r.json();if(!r.ok)throw Error(d.error);messages.push({role:'assistant',content:d.reply});add(d.reply,'assistant')}catch(err){add(err.message+' Set GROQ_API_KEY on the server.','assistant')}};</script></body></html>
