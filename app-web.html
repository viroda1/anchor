<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANCHOR UBG</title>
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        #ntf {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,20,0.9); color: #fff; padding: 10px 18px;
            border-radius: 12px; border: 1px solid #333; z-index: 99;
            display: none; align-items: center; gap: 12px; backdrop-filter: blur(5px);
        }
        #ntf b { color: #2ecc71; }
        #btn { background: #333; border: none; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        #ld { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #444; background: #000; }
        #browser-toolbar { position: fixed; z-index: 5; top: 12px; left: 14px; right: 14px; height: 52px; display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid #444; border-radius: 17px; background: #111d; backdrop-filter: blur(18px); }
        .browser-brand { display: flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; font-weight: 700; white-space: nowrap; }.browser-brand img { width: 25px; height: 25px; }
        #browser-fallback { display: none; position: fixed; inset: 0; z-index: 4; padding: 100px 24px 24px; background: #101418; color: #fff; text-align: center; } #browser-fallback a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 10px; background: #8bd3ff; color: #101418; text-decoration: none; font-weight: 700; }
        #browser-toolbar button { min-width: 31px; height: 31px; border: 1px solid #444; border-radius: 50%; background: #222; color: #ddd; cursor: pointer; } #browser-toolbar button:hover { background: #fff; color: #000; }
        #address { display: flex; flex: 1; gap: 6px; margin-left: 8px; } #address input { min-width: 0; flex: 1; padding: 9px 13px; border: 1px solid #444; border-radius: 12px; background: #080808; color: #fff; outline: 0; } #address button { border: 0 !important; border-radius: 11px !important; background: #fff !important; color: #000 !important; }
        #ifr { padding-top: 70px; }
    </style>
</head>
<body>
    <header id="browser-toolbar">
        <a href="index.html" class="browser-brand"><img src="icon-chrome.svg" alt=""> Anchor Browser</a>
        <button id="back" aria-label="Back">&#8592;</button><button id="forward" aria-label="Forward">&#8594;</button><button id="reload" aria-label="Reload">&#8635;</button>
        <form id="address"><input id="address-input" value="https://www.google.com" aria-label="Address"><button>Go</button></form>
        <button id="full" aria-label="Fullscreen">&#9974;</button>
    </header>
    <div id="ld">Connecting to Anchor Browser...</div>
    <div id="browser-fallback"><h1>Anchor Browser proxy unavailable</h1><p>This deployment cannot start the service worker. Open the requested page directly or deploy Anchor on a host with service-worker support.</p><a id="browser-fallback-link" target="_blank" rel="noopener">Open destination</a></div>
    <iframe id="ifr" allowfullscreen allow="autoplay; fullscreen; gamepad; microphone; camera"></iframe>

    <script>
        let scramjetStarted = false;
        async function startScramjet() {
            if (scramjetStarted) return;
            scramjetStarted = true;
            const loading = document.getElementById('ld');
            const appBase = new URL('.', document.baseURI);
            const assetUrl = (path) => new URL(path, appBase).toString();
            const destination = location.hash.slice(1) || 'https://www.google.com';
            const showFallback = (error) => {
                loading.style.display = 'none';
                document.getElementById('browser-fallback').style.display = 'block';
                const link = document.getElementById('browser-fallback-link');
                link.href = destination;
                link.textContent = `Open ${destination}`;
                console.error('Anchor Browser proxy unavailable:', error);
            };
            try {
                if (!('serviceWorker' in navigator)) throw new Error('Service workers are unavailable here.');
                const { ScramjetController } = window.$scramjetLoadController();
                const controller = new ScramjetController({
                    prefix: new URL('scramjet/', appBase).pathname,
                    files: {
                        wasm: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm',
                        all: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js',
                        sync: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.sync.js'
                    }
                });
                await controller.init();
                const registration = await navigator.serviceWorker.register(assetUrl('sw.js'), { scope: appBase.pathname });
                await navigator.serviceWorker.ready;
                const BareMux = await import('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs');
                const connection = new BareMux.BareMuxConnection(assetUrl('bareworker.js'));
                const wisp = localStorage.getItem('anchorWisp') || 'wss://anura.pro/wisp/';
                await connection.setTransport('https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs', [{ wisp }]);
                registration.active?.postMessage({ type: 'config', wispurl: wisp });
                const frame = controller.createFrame();
                frame.frame.id = 'ifr';
                frame.frame.allowFullscreen = true;
                frame.frame.addEventListener('load', () => { loading.style.display = 'none'; });
                document.body.replaceChild(frame.frame, document.getElementById('ifr'));
                frame.go(destination);
            } catch (error) {
                showFallback(error);
            }
        }
        document.getElementById('back').onclick = () => history.back();
        document.getElementById('forward').onclick = () => history.forward();
        document.getElementById('reload').onclick = () => location.reload();
        document.getElementById('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
        document.getElementById('address').onsubmit = (event) => { event.preventDefault(); const value = document.getElementById('address-input').value.trim(); if (value) { location.hash = value; location.reload(); } };
        window.addEventListener('load', startScramjet);
    </script>
</body>
</html>
