<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Browser</title>
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #777; background: #000; z-index: 4; }
        #browser-toolbar { position: fixed; z-index: 5; top: 12px; left: 14px; right: 14px; height: 52px; display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid #444; border-radius: 17px; background: #111d; backdrop-filter: blur(18px); }
        .browser-brand { display: flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; font-weight: 700; white-space: nowrap; }
        .browser-brand img { width: 25px; height: 25px; }
        #browser-toolbar button { min-width: 31px; height: 31px; border: 1px solid #444; border-radius: 50%; background: #222; color: #ddd; cursor: pointer; }
        #browser-toolbar button:hover { background: #fff; color: #000; }
        #address { display: flex; flex: 1; gap: 6px; margin-left: 8px; }
        #address input { min-width: 0; flex: 1; padding: 9px 13px; border: 1px solid #444; border-radius: 12px; background: #080808; color: #fff; outline: 0; }
        #address button { border: 0 !important; border-radius: 11px !important; background: #fff !important; color: #000 !important; }
        #fallback { display: none; position: fixed; inset: 0; z-index: 3; padding: 100px 24px 24px; background: #101418; color: #fff; text-align: center; }
        #fallback a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 10px; background: #8bd3ff; color: #101418; text-decoration: none; font-weight: 700; }
        @media (max-width: 650px) { .browser-brand { font-size: 0; } .browser-brand img { width: 23px; height: 23px; } #browser-toolbar { left: 7px; right: 7px; gap: 4px; } #address { margin-left: 2px; } }
    </style>
</head>
<body>
    <header id="browser-toolbar">
        <a href="index.html" class="browser-brand"><img src="icon-chrome.svg" alt=""> <span>Anchor Browser</span></a>
        <button id="back" type="button" aria-label="Back">&#8592;</button>
        <button id="forward" type="button" aria-label="Forward">&#8594;</button>
        <button id="reload" type="button" aria-label="Reload">&#8635;</button>
        <form id="address"><input id="address-input" value="https://www.google.com" aria-label="Address"><button type="submit">Go</button></form>
        <button id="fullscreen" type="button" aria-label="Fullscreen">&#9974;</button>
    </header>
    <div id="loading">Connecting to Anchor Browser...</div>
    <div id="fallback"><h1>Anchor Browser proxy unavailable</h1><p>This deployment cannot start the service worker. Open the requested page directly or deploy Anchor on a host with service-worker support.</p><a id="fallback-link" target="_blank" rel="noopener">Open destination</a></div>
    <iframe id="browser-frame" title="Anchor Browser" allowfullscreen allow="autoplay; fullscreen; gamepad; microphone; camera"></iframe>

    <script>
        let browserFrame;
        let currentUrl;

        function normaliseUrl(value) {
            const input = value.trim();
            if (!input) return null;
            return /^[a-z][a-z\d+.-]*:\/\//i.test(input) ? input : `https://${input}`;
        }

        async function startBrowser() {
            const loading = document.getElementById('loading');
            const appBase = new URL('.', document.baseURI);
            const assetUrl = (path) => new URL(path, appBase).toString();
            currentUrl = normaliseUrl(location.hash.slice(1)) || localStorage.getItem('browserHome') || 'https://www.google.com';
            document.getElementById('address-input').value = currentUrl;

            try {
                if (!('serviceWorker' in navigator)) throw new Error('Service workers are unavailable here.');
                if (!window.$scramjetLoadController) throw new Error('Scramjet failed to load.');
                const { ScramjetController } = window.$scramjetLoadController();
                const controller = new ScramjetController({
                    prefix: new URL('scramjet/', appBase).pathname,
                    files: {
                        wasm: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm',
                        all: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js',
                        sync: 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.sync.js'
                    }
                });
                await controller.init();
                const registration = await navigator.serviceWorker.register(assetUrl('sw.js'), { scope: appBase.pathname });
                await navigator.serviceWorker.ready;
                const BareMux = await import('https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs');
                const connection = new BareMux.BareMuxConnection(assetUrl('bareworker.js'));
                const wisp = localStorage.getItem('anchorWisp') || 'wss://anura.pro/wisp/';
                await connection.setTransport('https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs', [{ wisp }]);
                registration.active?.postMessage({ type: 'config', wispurl: wisp });

                const frame = controller.createFrame();
                browserFrame = frame;
                frame.frame.id = 'browser-frame';
                frame.frame.title = 'Anchor Browser';
                frame.frame.allowFullscreen = true;
                frame.frame.addEventListener('load', () => { loading.style.display = 'none'; });
                document.body.replaceChild(frame.frame, document.getElementById('browser-frame'));
                frame.go(currentUrl);
            } catch (error) {
                loading.style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
                const link = document.getElementById('fallback-link');
                link.href = currentUrl;
                link.textContent = `Open ${currentUrl}`;
                console.error('Anchor Browser proxy unavailable:', error);
            }
        }

        document.getElementById('back').onclick = () => browserFrame?.back?.();
        document.getElementById('forward').onclick = () => browserFrame?.forward?.();
        document.getElementById('reload').onclick = () => browserFrame?.reload?.();
        document.getElementById('fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
        document.getElementById('address').onsubmit = (event) => {
            event.preventDefault();
            const value = normaliseUrl(document.getElementById('address-input').value);
            if (value) { localStorage.setItem('browserHome', value); location.hash = value; location.reload(); }
        };
        window.addEventListener('load', startBrowser);
    </script>
</body>
</html
