<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anchor Browser - Anchor OS</title>
    <link rel="icon" type="image/svg+xml" href="icon-chrome.svg">
    
    <!-- Anchor OS Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Scramjet Main Script -->
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js"></script>
    
    <style>
        :root {
            --bg: #0a0e14;
            --surface: rgba(15, 20, 25, 0.85);
            --surface-solid: #12121e;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #c5e86c;
            --accent-glow: rgba(197, 232, 108, 0.4);
            --accent-hover: #d8ff7a;
            --text: #f5f7fa;
            --text-muted: #9bc4d8;
            --danger: #ff4d4d;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px; -webkit-font-smoothing: antialiased;
        }

        /* ===== Loading Screen ===== */
        #loading {
            position: fixed; inset: 0; z-index: 200;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 24px;
            background: radial-gradient(ellipse at center, #111 0%, var(--bg) 70%);
            transition: opacity 0.4s ease;
        }
        .boot-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900; color: var(--accent);
            letter-spacing: 4px; display: flex; align-items: center; gap: 15px;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        .loader-ring {
            width: 50px; height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            color: var(--text-muted); font-size: 13px; font-weight: 600;
            letter-spacing: 2px; animation: pulse 1.5s ease-in-out infinite;
            text-transform: uppercase;
        }
        @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ===== Toolbar ===== */
        #toolbar {
            position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 50;
            display: flex; align-items: center; gap: 10px; padding: 0 16px;
            background: rgba(10, 14, 20, 0.8);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; font-weight: 900; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px;
            text-decoration: none; margin-right: 10px;
            text-shadow: 0 0 8px var(--accent-glow);
            display: flex; align-items: center; gap: 8px;
        }

        .nav-btn {
            width: 38px; height: 38px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.03); color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); flex-shrink: 0; border-radius: 10px;
            font-size: 15px;
        }
        .nav-btn:hover {
            background: rgba(197, 232, 108, 0.1); color: var(--accent);
            border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
        }
        .nav-btn:active { transform: scale(0.92); }

        #address-bar {
            flex: 1; display: flex; align-items: center; gap: 0; height: 38px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 10px; padding: 0 4px 0 16px; min-width: 0;
            transition: var(--transition);
        }
        #address-bar:focus-within {
            border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
        }
        #address-input {
            flex: 1; min-width: 0; border: none; background: transparent;
            color: var(--text); font-size: 15px; padding: 8px 0; outline: none;
            font-family: 'Rajdhani', sans-serif; font-weight: 600;
        }
        #address-input::placeholder { color: var(--text-muted); }
        #go-btn {
            border: none; background: var(--accent); color: var(--bg);
            padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 800;
            cursor: pointer; transition: var(--transition); white-space: nowrap;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        #go-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        #go-btn:active { transform: scale(0.95); }

        /* ===== Load Progress Bar ===== */
        #progress-bar {
            position: fixed; top: 56px; left: 0; height: 2px;
            background: var(--accent); width: 0%; z-index: 55;
            transition: width 0.3s ease, opacity 0.4s ease;
            box-shadow: 0 0 8px var(--accent);
        }

        /* ===== Frame ===== */
        #frame-container {
            position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
            background: var(--bg);
        }
        #frame-container iframe {
            width: 100%; height: 100%; border: none; display: block;
        }

        /* ===== Error Screen ===== */
        #error-screen {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: var(--bg); overflow-y: auto; padding-top: 56px;
        }
        .error-card {
            max-width: 600px; margin: 60px auto; padding: 40px;
            background: var(--surface); border: 1px solid var(--danger);
            border-radius: 16px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.2);
            backdrop-filter: blur(16px);
        }
        .error-icon {
            width: 60px; height: 60px; margin: 0 auto 20px;
            background: rgba(255, 77, 77, 0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--danger); font-size: 24px;
        }
        .error-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px; margin-bottom: 10px; color: var(--danger);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .error-card > p { color: var(--text-muted); line-height: 1.6; margin-bottom: 18px; font-size: 16px; }
        .error-code {
            background: #000; border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; text-align: left;
            font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; color: var(--text-muted);
            margin: 18px 0; overflow-x: auto; white-space: pre; line-height: 1.5;
        }
        .error-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
        .btn-primary, .btn-secondary {
            padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 700;
            cursor: pointer; text-decoration: none; transition: var(--transition);
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .btn-primary { background: var(--danger); color: #fff; border: 1px solid var(--danger); }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(255, 77, 77, 0.4); }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== Settings Dropdown ===== */
        #settings-dropdown {
            display: none; position: fixed; top: 66px; right: 16px;
            z-index: 60; width: 340px; padding: 20px;
            background: rgba(10, 14, 20, 0.95);
            border: 1px solid var(--accent); border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px var(--accent-glow);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        #settings-dropdown.open { display: block; animation: slideDown 0.2s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        
        #settings-dropdown h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px; color: var(--accent); margin-bottom: 15px;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border); padding-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }

        .wisp-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 8px; transition: var(--transition);
        }
        .wisp-item.active {
            border-color: var(--accent); background: rgba(197, 232, 108, 0.1);
            box-shadow: 0 0 10px rgba(197, 232, 108, 0.2);
        }
        .wisp-item-info { display: flex; flex-direction: column; overflow: hidden; }
        .wisp-item-name { font-weight: 700; color: var(--text); font-size: 14px; }
        .wisp-item-url {
            color: var(--text-muted); font-size: 11px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 220px;
        }
        .wisp-item-actions { display: flex; gap: 5px; flex-shrink: 0; }
        .wisp-action-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-muted); cursor: pointer; width: 28px; height: 28px;
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; transition: var(--transition);
        }
        .wisp-action-btn:hover { border-color: var(--accent); color: var(--accent); }
        .wisp-action-btn.delete:hover { border-color: var(--danger); color: var(--danger); }

        .wisp-add-form { display: flex; gap: 8px; margin-top: 15px; margin-bottom: 15px; }
        .wisp-add-form input {
            flex: 1; padding: 8px 12px; border: 1px solid var(--border);
            background: #000; color: var(--text); border-radius: 6px; outline: none;
            font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px;
        }
        .wisp-add-form input::placeholder { color: var(--text-muted); }
        .wisp-add-form input:focus { border-color: var(--accent); }
        .wisp-add-form button {
            padding: 0 14px; border: 1px solid var(--accent);
            background: transparent; color: var(--accent); border-radius: 6px;
            cursor: pointer; transition: var(--transition);
        }
        .wisp-add-form button:hover { background: var(--accent); color: var(--bg); }

        .save-btn {
            width: 100%; margin-top: 5px; padding: 12px; border: 1px solid var(--accent);
            border-radius: 8px; background: transparent; color: var(--accent);
            font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--transition);
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .save-btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 15px var(--accent-glow); }

        /* ===== Toasts ===== */
        #toast-container {
            position: fixed; top: 70px; right: 20px; z-index: 300;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(15,20,25,0.95); border: 1px solid var(--border);
            color: var(--text); padding: 12px 20px; border-radius: 8px;
            font-size: 14px; backdrop-filter: blur(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: all 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .toast.error { border-color: var(--danger); }
        .toast.success { border-color: var(--accent); }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .brand span { display: none; }
            #toolbar { padding: 0 8px; gap: 6px; }
            .nav-btn { width: 34px; height: 34px; }
            #go-btn { padding: 8px 12px; }
            #address-bar { padding: 0 2px 0 10px; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
    <div class="boot-logo"><i class="fas fa-anchor"></i> ANCHOR BROWSER</div>
    <div class="loader-ring"></div>
    <div class="loader-text">INITIALIZING PROXY...</div>
</div>

<!-- Toolbar -->
<header id="toolbar">
    <a href="index.html" class="brand"><i class="fas fa-anchor"></i> <span>ANCHOR</span></a>
    <button class="nav-btn" id="back-btn" title="Back (Alt+←)"><i class="fas fa-chevron-left"></i></button>
    <button class="nav-btn" id="forward-btn" title="Forward (Alt+→)"><i class="fas fa-chevron-right"></i></button>
    <button class="nav-btn" id="reload-btn" title="Reload (Ctrl+R)"><i class="fas fa-rotate-right"></i></button>
    <form id="address-bar" autocomplete="off">
        <input id="address-input" type="text" placeholder="Search Google or type a URL" spellcheck="false" aria-label="Address bar">
        <button id="go-btn" type="submit">GO</button>
    </form>
    <button class="nav-btn" id="settings-btn" title="Settings"><i class="fas fa-gear"></i></button>
    <button class="nav-btn" id="fullscreen-btn" title="Fullscreen (F11)"><i class="fas fa-expand"></i></button>
</header>

<!-- Progress Bar -->
<div id="progress-bar" style="opacity:0;"></div>

<!-- Frame -->
<div id="frame-container"></div>

<!-- Settings -->
<div id="settings-dropdown">
    <h3><i class="fas fa-server"></i> Wisp Backends</h3>
    <div id="wisp-list"></div>
    
    <div class="wisp-add-form">
        <input id="wisp-name-input" type="text" placeholder="Name" style="flex: 0.4;">
        <input id="wisp-url-input" type="text" placeholder="wss://...">
        <button id="add-wisp-btn"><i class="fas fa-plus"></i></button>
    </div>
    
    <button class="save-btn" id="save-settings">APPLY & RELOAD</button>
</div>

<!-- Error -->
<div id="error-screen">
    <div class="error-card">
        <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h1>Proxy Initialization Failed</h1>
        <p id="error-message"></p>
        <div class="error-code" id="error-code"></div>
        <div class="error-actions">
            <a id="error-link" class="btn-primary" target="_blank" rel="noopener">Open Direct</a>
            <button class="btn-secondary" onclick="location.reload()">Retry</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   CONFIG & STATE
   ============================================================ */
const SCRAMJET_CDN   = 'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS';
const DEFAULT_WISP   = 'wss://anura.pro/wisp/';
const DEFAULT_HOME   = 'https://www.google.com';

let browserFrame  = null;
let currentUrl    = DEFAULT_HOME;

let wispServers = JSON.parse(localStorage.getItem('anchorWispServers')) || [
    { name: 'Anura Pro', url: 'wss://anura.pro/wisp/' }
];
let activeWispUrl = localStorage.getItem('anchorActiveWisp') || wispServers[0]?.url;

/* ============================================================
   UTILITIES
   ============================================================ */
function normalizeUrl(input) {
    const v = input.trim();
    if (!v) return null;
    if (/^[a-z][a-z\d+.-]*:\/\//i.test(v)) return v;
    if (/^(localhost|127\.0\.0\.1|(\d{1,3}\.){3}\d{1,3})(:\d+)?(\/|$)/i.test(v)) return `http://${v}`;
    if (/^[\w-]+(\.[\w-]+)+([/:?#].*)?$/.test(v)) return `https://${v}`;
    return `https://www.google.com/search?q=${encodeURIComponent(v)}`;
}

function showProgress() {
    const bar = document.getElementById('progress-bar');
    bar.style.opacity = '1';
    bar.style.width = '0%';
    requestAnimationFrame(() => { bar.style.width = '70%'; });
}

function hideProgress() {
    const bar = document.getElementById('progress-bar');
    bar.style.width = '100%';
    setTimeout(() => { bar.style.opacity = '0'; bar.style.width = '0%'; }, 300);
}

function popMsg(txt, type="info") {
    let box = document.getElementById('toast-container');
    if (!box) {
        box = document.createElement('div');
        box.id = 'toast-container';
        document.body.appendChild(box);
    }
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${txt}`;
    box.appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(100%)';
        setTimeout(() => t.remove(), 300);
    }, 3000);
}

/* ============================================================
   WISP BACKEND MANAGER
   ============================================================ */
function renderWispList() {
    const list = document.getElementById('wisp-list');
    list.innerHTML = '';
    
    if (wispServers.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:15px; font-size:13px;">No backends added.<br>Add one below to start.</div>';
        return;
    }

    wispServers.forEach((server, index) => {
        const item = document.createElement('div');
        item.className = `wisp-item ${server.url === activeWispUrl ? 'active' : ''}`;
        
        item.innerHTML = `
            <div class="wisp-item-info">
                <span class="wisp-item-name">${server.name}</span>
                <span class="wisp-item-url">${server.url}</span>
            </div>
            <div class="wisp-item-actions">
                ${server.url !== activeWispUrl ? `<button class="wisp-action-btn activate" title="Set Active"><i class="fas fa-check"></i></button>` : ''}
                <button class="wisp-action-btn delete" title="Delete"><i class="fas fa-times"></i></button>
            </div>
        `;
        
        if (server.url !== activeWispUrl) {
            item.querySelector('.activate').onclick = () => {
                activeWispUrl = server.url;
                localStorage.setItem('anchorActiveWisp', activeWispUrl);
                renderWispList();
                popMsg("Active backend updated. Click Apply to reload.", "success");
            };
        }
        
        item.querySelector('.delete').onclick = () => {
            wispServers.splice(index, 1);
            localStorage.setItem('anchorWispServers', JSON.stringify(wispServers));
            if (activeWispUrl === server.url && wispServers.length > 0) {
                activeWispUrl = wispServers[0].url;
                localStorage.setItem('anchorActiveWisp', activeWispUrl);
            } else if (wispServers.length === 0) {
                activeWispUrl = null;
                localStorage.removeItem('anchorActiveWisp');
            }
            renderWispList();
        };
        
        list.appendChild(item);
    });
}

document.getElementById('add-wisp-btn').onclick = () => {
    const nameInput = document.getElementById('wisp-name-input');
    const urlInput = document.getElementById('wisp-url-input');
    const name = nameInput.value.trim() || `Backend ${wispServers.length + 1}`;
    const url = urlInput.value.trim();
    if (url) {
        wispServers.push({ name, url });
        localStorage.setItem('anchorWispServers', JSON.stringify(wispServers));
        if (!activeWispUrl) {
            activeWispUrl = url;
            localStorage.setItem('anchorActiveWisp', activeWispUrl);
        }
        nameInput.value = '';
        urlInput.value = '';
        renderWispList();
    } else {
        popMsg("URL cannot be empty.", "error");
    }
};

/* ============================================================
   SCRAMJET CONTROLLER
   ============================================================ */
async function getScramjetControllerClass() {
    if (window.ScramjetController) return window.ScramjetController;
    
    for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 200));
        if (window.ScramjetController) return window.ScramjetController;
    }

    try {
        const mod = await import(`${SCRAMJET_CDN}/scramjet.all.js`);
        return mod.ScramjetController || mod.default?.ScramjetController;
    } catch (_) { }

    throw new Error('ScramjetController not found. The CDN script failed to load.');
}

/* ============================================================
   ERROR UI
   ============================================================ */
function showError(title, message, code) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-screen');
    el.style.display = 'block';
    document.querySelector('#error-screen h1').textContent = title;
    document.getElementById('error-message').textContent = message;
    const codeEl = document.getElementById('error-code');
    if (code) { codeEl.textContent = code; codeEl.style.display = 'block'; }
    else      { codeEl.style.display = 'none'; }
    const link = document.getElementById('error-link');
    link.href = currentUrl;
    try { link.textContent = `Open ${new URL(currentUrl).hostname}`; }
    catch { link.textContent = 'Open Direct'; }
}

/* ============================================================
   MAIN START
   ============================================================ */
async function startBrowser() {
    const loading = document.getElementById('loading');

    currentUrl = normalizeUrl(location.hash.slice(1))
              || localStorage.getItem('anchorHome')
              || DEFAULT_HOME;
    document.getElementById('address-input').value = currentUrl;

    // Check if user has any backends configured
    if (!activeWispUrl) {
        document.getElementById('loading').style.display = 'none';
        settingsDropdown.classList.add('open');
        popMsg("Please add a Wisp backend to begin.", "error");
        return;
    }

    try {
        // 1 — Scramjet controller
        const Controller = await getScramjetControllerClass();
        const prefix = new URL('scramjet/', location.href).pathname;
        
        const controller = new Controller({
            prefix: prefix,
            files: {
                wasm:  `${SCRAMJET_CDN}/scramjet.wasm.wasm`,
                sync:  `${SCRAMJET_CDN}/scramjet.sync.js`,
                all:   `${SCRAMJET_CDN}/scramjet.all.js`,
            }
        });

        await controller.init();

        // 2 — Register local Service Worker
        if (!('serviceWorker' in navigator)) {
            throw new Error('Service workers are not available in this browser.');
        }
        const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        await navigator.serviceWorker.ready;
        
        // 3 — Send Multiple Wisp Configs to Service Worker
        navigator.serviceWorker.controller.postMessage({ 
            type: 'config', 
            wispurl: activeWispUrl, // The currently selected active URL
            servers: wispServers.map(s => ({ url: s.url, name: s.name })), // Array of all backends for autoswitch
            autoswitch: true 
        });

        // 4 — Create browser frame via Scramjet
        const frame = controller.createFrame();
        browserFrame = frame;

        frame.frame.style.cssText = 'width:100%;height:100%;border:none;display:block;';
        frame.frame.setAttribute('allow', 'autoplay; fullscreen; gamepad; microphone; camera; clipboard-read; clipboard-write; encrypted-media');
        frame.frame.setAttribute('allowfullscreen', '');
        frame.frame.title = 'Anchor Browser Content';

        frame.frame.addEventListener('loadstart', () => { showProgress(); });
        frame.frame.addEventListener('load', () => {
            hideProgress();
            loading.style.opacity = '0';
            setTimeout(() => { loading.style.display = 'none'; }, 400);
        });

        // Fallback hide loader after 10s
        setTimeout(() => {
            if (loading.style.display !== 'none') {
                loading.style.opacity = '0';
                setTimeout(() => { loading.style.display = 'none'; }, 400);
            }
        }, 10000);

        document.getElementById('frame-container').appendChild(frame.frame);
        showProgress();
        frame.go(currentUrl);

    } catch (error) {
        console.error('[Anchor] Init error:', error);
        showError(
            'Proxy Initialization Failed',
            error.message || 'An unknown error occurred during initialization.',
            error.stack || ''
        );
    }
}

/* ============================================================
   NAVIGATION HANDLERS
   ============================================================ */
document.getElementById('back-btn').onclick = () => browserFrame?.back?.();
document.getElementById('forward-btn').onclick = () => browserFrame?.forward?.();
document.getElementById('reload-btn').onclick = () => browserFrame?.reload?.();
document.getElementById('fullscreen-btn').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
};

document.getElementById('address-bar').onsubmit = (e) => {
    e.preventDefault();
    const value = normalizeUrl(document.getElementById('address-input').value);
    if (!value) return;
    currentUrl = value;
    localStorage.setItem('anchorHome', value);
    location.hash = value;
    if (browserFrame?.go) {
        showProgress();
        browserFrame.go(value);
    } else {
        location.reload();
    }
};

/* ============================================================
   SETTINGS DROPDOWN
   ============================================================ */
const settingsBtn = document.getElementById('settings-btn');
const settingsDropdown = document.getElementById('settings-dropdown');

settingsBtn.onclick = (e) => {
    e.stopPropagation();
    settingsDropdown.classList.toggle('open');
    if (settingsDropdown.classList.contains('open')) renderWispList();
};

document.addEventListener('click', (e) => {
    if (!settingsDropdown.contains(e.target) && e.target !== settingsBtn) {
        settingsDropdown.classList.remove('open');
    }
});

document.getElementById('save-settings').onclick = () => {
    location.reload();
};

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
        e.preventDefault();
        const input = document.getElementById('address-input');
        input.focus(); input.select();
    }
    if (e.altKey && e.key === 'ArrowLeft')  { e.preventDefault(); document.getElementById('back-btn').click(); }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('forward-btn').click(); }
    if (e.key === 'Escape') settingsDropdown.classList.remove('open');
});

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('DOMContentLoaded', startBrowser);
</script>
</body>
</html>
