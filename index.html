<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arc AI - Anchor OS</title>
  <link rel="icon" type="image/svg+xml" href="arch-mark.svg">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --os-bg: #0a0e14;
      --os-surface: rgba(15, 20, 25, 0.85);
      --os-border: rgba(255, 255, 255, 0.1);
      --os-accent: #c5e86c;
      --os-text: #f5f7fa;
      --os-text-dim: #9bc4d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--os-bg);
      color: var(--os-text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at center, rgba(197, 232, 108, 0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    #arc-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #arc-window {
      position: relative;
      z-index: 20;
      width: min(480px, 90vw);
      height: min(680px, 85vh);
      background: var(--os-surface);
      backdrop-filter: blur(24px);
      border: 1px solid var(--os-border);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.95);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #arc-window.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Boot Screen */
    #arc-boot-screen {
      position: absolute;
      inset: 0;
      background: #0b0f12;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      transition: opacity 0.5s ease;
    }

    .boot-arc {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      color: var(--os-accent);
      text-shadow: 0 0 20px rgba(197, 232, 108, 0.6);
      letter-spacing: 4px;
    }

    .boot-sub {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--os-text-dim);
      text-transform: uppercase;
    }

    .boot-loader {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--os-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .boot-status {
      font-size: 0.85rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .boot-warning {
      position: absolute;
      bottom: 30px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 0 20px;
    }

    /* Status Pill */
    #status-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--os-border);
      background: rgba(0,0,0,0.2);
    }

    #status-pill span:first-child {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-right: auto;
    }

    .status-icon {
      width: 8px;
      height: 8px;
      background-color: var(--os-accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--os-accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(197, 232, 108, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(197, 232, 108, 0); }
      100% { box-shadow: 0 0 0 0 rgba(197, 232, 108, 0); }
    }

    #status-text {
      font-size: 0.85rem;
      color: var(--os-text-dim);
    }

    /* Chat History */
    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    #chat-history::-webkit-scrollbar { width: 6px; }
    #chat-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .assistant {
      align-self: flex-start;
      background: #26343d;
      border: 1px solid rgba(255,255,255,0.05);
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: var(--os-accent);
      color: #101418;
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }

    /* Bottom Wrapper / Input */
    #bottom-wrapper {
      padding: 16px 20px;
      border-top: 1px solid var(--os-border);
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--os-text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--os-text); }

    #chat-input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--os-border);
      color: var(--os-text);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus { border-color: var(--os-accent); }

    #mode-toggle {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--os-border);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    #mode-toggle:hover { background: rgba(255,255,255,0.1); }

    #action-orb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--os-accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.2s;
      box-shadow: 0 0 12px rgba(197, 232, 108, 0.4);
    }

    #action-orb::after {
      content: '';
      width: 12px;
      height: 12px;
      border-top: 2px solid #101418;
      border-right: 2px solid #101418;
      transform: rotate(45deg) translate(-2px, 2px);
    }

    #action-orb:hover { transform: scale(1.1); }
    #action-orb:active { transform: scale(0.95); }

    .hidden-input { display: none; }
  </style>
</head>
<body>

<!-- Assistant -->
<div id="arc-backdrop" onclick="closeArc()" aria-hidden="true"></div>
<aside id="arc-window" aria-label="Arc AI Assistant">
  <div id="arc-boot-screen">
    <div class="boot-arc">ARC.</div>
    <div class="boot-sub">ANCHOR OS INTELLIGENCE</div>
    <div class="boot-loader">
      <div class="spinner"></div>
      <div class="boot-status">Starting Arc AI...</div>
    </div>
    <div class="boot-warning">Arc AI was created by Isaac Hughley and is hosted by AnchorOS.</div>
  </div>

  <header id="status-pill">
    <span>ARC AI</span>
    <div class="status-icon"></div>
    <span id="status-text">Online</span>
  </header>
  
  <main id="chat-history" aria-live="polite">
    <div class="msg assistant">Hi, I am Arc. What would you like to explore?</div>
  </main>

  <footer id="bottom-wrapper">
    <input type="file" id="file-upload" accept="image/*" class="hidden-input">
    <button class="icon-btn" onclick="document.getElementById('file-upload').click()" aria-label="Upload Image">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
    </button>
    <textarea id="chat-input" placeholder="Ask Arc..." rows="1" aria-label="Chat Input"></textarea>
    <div id="mode-toggle" role="button" tabindex="0">FAST</div>
    <div id="action-orb" role="button" tabindex="0" aria-label="Send Message"></div>
  </footer>
</aside>

<script>
  // --- Arc AI Boot & UI Logic ---
  const arcWindow = document.getElementById('arc-window');
  const arcBackdrop = document.getElementById('arc-backdrop');
  const bootScreen = document.getElementById('arc-boot-screen');
  const chatHistory = document.getElementById('chat-history');
  const chatInput = document.getElementById('chat-input');
  const actionOrb = document.getElementById('action-orb');
  const modeToggle = document.getElementById('mode-toggle');
  
  const messages = [{ role: 'assistant', content: 'Hi, I am Arc. What would you like to explore?' }];

  // Initialize UI
  window.onload = () => {
    setTimeout(() => {
      arcWindow.classList.add('active');
      arcBackdrop.style.opacity = '1';
      arcBackdrop.style.pointerEvents = 'auto';
    }, 200);

    // Simulate boot sequence
    setTimeout(() => {
      bootScreen.style.opacity = '0';
      setTimeout(() => bootScreen.style.display = 'none', 500);
    }, 2200);
  };

  function closeArc() {
    arcWindow.classList.remove('active');
    arcBackdrop.style.opacity = '0';
    arcBackdrop.style.pointerEvents = 'none';
  }

  function addMessage(text, kind) {
    const el = document.createElement('div');
    el.className = `msg ${kind}`;
    el.textContent = text;
    chatHistory.appendChild(el);
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }

  async function handleSend() {
    const text = chatInput.value.trim();
    if (!text) return;

    chatInput.value = '';
    chatInput.style.height = 'auto'; // Reset textarea height
    messages.push({ role: 'user', content: text });
    addMessage(text, 'user');

    // Add thinking indicator
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg assistant';
    thinkingEl.textContent = '...';
    chatHistory.appendChild(thinkingEl);
    chatHistory.scrollTop = chatHistory.scrollHeight;

    try {
      const response = await fetch('/api/ask-arc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();
      
      // Remove thinking indicator
      thinkingEl.remove();

      if (!response.ok) throw Error(data.error || 'Arc could not reply.');
      
      messages.push({ role: 'assistant', content: data.reply });
      addMessage(data.reply, 'assistant');
    } catch (error) {
      thinkingEl.remove();
      addMessage(error.message + ' Configure GROQ_API_KEY on the server.', 'assistant');
    }
  }

  // Event Listeners
  actionOrb.addEventListener('click', handleSend);
  modeToggle.addEventListener('click', () => {
    const modes = ['FAST', 'SMART', 'CREATE'];
    let current = modes.indexOf(modeToggle.textContent);
    modeToggle.textContent = modes[(current + 1) % modes.length];
  });

  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
</script>
</body>
</html>
