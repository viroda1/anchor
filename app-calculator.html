<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Calculator</title><style>body{margin:0;background:#101418;color:#f5f7fa;font:600 18px system-ui;display:grid;place-items:center;height:100vh}.calc{width:min(340px,90vw);padding:24px;background:#182027;border:1px solid #34434d;border-radius:24px;box-shadow:0 20px 50px #0008}h1{font-size:16px;letter-spacing:2px}input{width:100%;box-sizing:border-box;background:#0b0f12;color:#fff;border:1px solid #40505c;border-radius:14px;padding:16px;text-align:right;font-size:28px;margin:12px 0 16px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:0;border-radius:14px;padding:16px;background:#26343d;color:#fff;font-size:18px;cursor:pointer}button:hover{background:#3b515e}.op{background:#c5e86c;color:#101418}</style></head><body><main class="calc"><h1>ANCHOR CALCULATOR</h1><input id="display" value="0" readonly><div class="keys"></div></main><script>const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];const grid=document.querySelector('.keys');const display=document.querySelector('#display');let value='';keys.forEach(key=>{const button=document.createElement('button');button.textContent=key;button.className='op';button.onclick=()=>{if(key==='C')value='';else if(key==='='){try{value=String(Function('return '+value)())}catch{value='Error'}}else value+=key;display.value=value||'0'};grid.append(button)});</script></body></html>
