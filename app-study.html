<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Study</title><style>body{margin:0;background:#101418;color:#f5f7fa;font:16px system-ui;display:grid;place-items:center;height:100vh}.study{width:min(560px,88vw);padding:28px;background:#182027;border:1px solid #34434d;border-radius:24px;text-align:center}h1{font-size:18px;letter-spacing:2px}#card{min-height:130px;display:grid;place-items:center;padding:24px;margin:20px 0;background:#0b0f12;border-radius:18px;font-size:25px}button{border:0;border-radius:14px;padding:14px 22px;background:#c5e86c;color:#101418;font-weight:700;cursor:pointer}</style></head><body><main class="study"><h1>ANCHOR STUDY</h1><p>Quick review cards</p><section id="card"></section><button id="next">Next card</button></main><script>const cards=[['What is the largest planet?','Jupiter'],['What does HTML structure?','A web page'],['What is 12 x 8?','96'],['What gas do plants use?','Carbon dioxide']];let index=0,answer=false;const card=document.querySelector('#card');function show(){card.textContent=answer?cards[index][1]:cards[index][0]}document.querySelector('#next').onclick=()=>{if(answer){index=(index+1)%cards.length;answer=false}else answer=true;show()};show();</script></body></html>
