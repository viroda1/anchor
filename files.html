<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Files</title><style>body{margin:0;background:#11161a;color:#eef2f5;font:16px system-ui}main{width:min(760px,92vw);margin:7vh auto}.panel{padding:20px;border:1px solid #37414b;border-radius:12px;background:#182027}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #465461}input{background:#101418;color:#fff;width:60%}button{background:#8bd3ff;cursor:pointer}.file{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #303b43}a{color:#8bd3ff}</style></head>
<body><main><p><a href="index.html">Anchor</a></p><h1>Anchor Files</h1><section class="panel"><form id="form"><input id="name" placeholder="New note name" required><button>Create</button></form><div id="list"></div></section></main><script>const key='anchor_files',list=document.getElementById('list'),form=document.getElementById('form'),nameInput=document.getElementById('name');let files=JSON.parse(localStorage.getItem(key)||'[]');function render(){list.innerHTML='';files.forEach((name,index)=>{const row=document.createElement('div');row.className='file';row.innerHTML='<span></span><button type="button">Delete</button>';row.firstChild.textContent=name;row.lastChild.onclick=()=>{files.splice(index,1);save()};list.append(row)})}function save(){localStorage.setItem(key,JSON.stringify(files));render()}form.onsubmit=e=>{e.preventDefault();files.push(nameInput.value.trim());nameInput.value='';save()};render();</script></body>
</html>
