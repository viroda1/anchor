<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anchor Chat</title><style>body{margin:0;background:#101418;color:#eef2f5;font:16px system-ui;min-height:100vh}main{width:min(760px,92vw);margin:8vh auto}h1{font-size:2rem}.messages{height:52vh;overflow:auto;border:1px solid #37414b;border-radius:12px;padding:14px;background:#182027}.message{padding:10px 12px;margin:8px 0;border-radius:10px;max-width:80%;background:#26313a}.mine{margin-left:auto;background:#31536a}.composer{display:flex;gap:8px;margin-top:12px}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #465461}input{flex:1;background:#182027;color:#fff}button{background:#8bd3ff;color:#101418;cursor:pointer}a{color:#8bd3ff}</style></head>
<body><main><p><a href="index.html">Anchor</a></p><h1>Anchor Chat</h1><section class="messages" id="messages" aria-live="polite"></section><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Write a message..."><button>Send</button></form></main><script>const messages=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input');function add(text,mine){const item=document.createElement('div');item.className='message'+(mine?' mine':'');item.textContent=text;messages.append(item);messages.scrollTop=messages.scrollHeight}form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text)return;add(text,true);input.value='';setTimeout(()=>add('Message saved locally. Use Arc AI for assistant replies.',false),250)});add('Welcome to Anchor Chat.',false);</script></body>
</html>
