<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc</title>
<style>
body{margin:0;background:#101418;color:#f5f7fa;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(720px,90vw);height:min(80vh,680px);display:flex;flex-direction:column;padding:24px;background:#182027;border:1px solid #34434d;border-radius:24px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:20px;letter-spacing:2px}.head span{color:#9bc4d8}.chat{flex:1;overflow:auto;padding:18px 0}.msg{padding:13px 16px;border-radius:16px;margin:10px 0;max-width:80%;white-space:pre-wrap}.assistant{background:#26343d}.user{background:#c5e86c;color:#101418;margin-left:auto}.form{display:flex;gap:10px}.form input{flex:1;padding:14px;border-radius:14px;border:1px solid #40505c;background:#0b0f12;color:#fff}.form button{border:0;border-radius:14px;padding:0 20px;background:#c5e86c;font-weight:700;cursor:pointer}
</style>
</head>
<body><main class="app"><header class="head"><h1>ARC AI</h1><span>Created by Isaac Hughley | Hosted by AnchorOS</span></header><section class="chat" id="chat" aria-live="polite"><div class="msg assistant">Hi, I am Arc. What would you like to explore?</div></section><form class="form" id="form"><input id="input" placeholder="Ask Arc a question" autocomplete="off"><button>Send</button></form></main>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#input'),chat=document.querySelector('#chat'),messages=[];
function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight}
form.onsubmit=async event=>{event.preventDefault();const text=input.value.trim();if(!text)return;input.value='';messages.push({role:'user',content:text});add(text,'user');try{const response=await fetch('/api/ask-arc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await response.json();if(!response.ok)throw Error(data.error||'Arc could not reply.');messages.push({role:'assistant',content:data.reply});add(data.reply,'assistant')}catch(error){add(error.message+' Configure GROQ_API_KEY on the server.','assistant')}};
</script></body></html>
